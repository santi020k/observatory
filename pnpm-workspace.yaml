packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  '@astrojs/check': '^0.9.9'
  '@astrojs/cloudflare': '^14.2.3'
  '@cloudflare/workers-types': '^5.20260822.1'
  '@simplewebauthn/browser': '^13.3.0'
  '@simplewebauthn/server': '^13.3.2'
  '@commitlint/cli': ^21.2.2
  '@commitlint/config-conventional': ^21.2.2
  '@santi020k/astro-doctor': '^1.3.2'
  '@santi020k/commitprompt': ^1.1.0
  '@santi020k/eslint-config-astro': ^3.1.2
  '@santi020k/eslint-config-basic': ^3.5.1
  '@santi020k/eslint-config-extensions': ^3.1.1
  '@santi020k/eslint-config-formats': ^3.1.1
  '@santi020k/eslint-config-hono': ^3.1.0
  '@santi020k/eslint-config-libraries': ^3.1.1
  '@santi020k/eslint-config-testing': ^3.1.1
  '@santi020k/eslint-config-tools': ^3.1.1
  '@santi020k/eslint-plugin-astro-doctor': '^1.3.2'
  '@santi020k/lumen-astro': '^1.0.0'
  '@santi020k/theme': '^1.2.0'
  '@types/node': '^26.1.1'
  astro: '^7.2.4'
  drizzle-orm: '^0.45.2'
  eslint: ^10.9.0
  hono: '^4.13.3'
  husky: ^9.1.7
  prettier: ^3.9.5
  prettier-plugin-astro: ^0.14.1
  turbo: ^2.10.11
  typescript: '^6.0.3'
  vite: '^8.1.4'
  vitest: '^4.1.10'
  wrangler: '^4.125.0'
  zod: '^4.4.3'

allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@santi020k/astro-doctor'
  - '@santi020k/eslint-config-basic'
  - '@santi020k/commitprompt'
  - '@santi020k/eslint-plugin-astro-doctor'
  - '@santi020k/lumen'
  - '@santi020k/lumen-astro'
  - '@santi020k/lumen-core'
  - astro
  - hono@4.13.3
  - '@santi020k/eslint-config-typescript'
  - '@santi020k/eslint-config-astro@3.1.2'
  - '@cloudflare/workers-types@5.20260822.1'
  - eslint@10.9.0

overrides:
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=2.0.0 <3': 2.1.4
  'brace-expansion@>=5.0.0 <6': 5.0.9
  'fast-uri@>=3.0.0 <4': 3.1.5
  'js-yaml@>=4.0.0 <5': 4.3.1
  'nanoid@>=3.0.0 <4': 3.3.18
  'postcss@>=8.0.0 <9': 8.5.26
  'undici@>=7.0.0 <8': 7.29.0
