packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  '@astrojs/check': '^0.9.9'
  '@astrojs/cloudflare': '^14.1.4'
  '@cloudflare/workers-types': '^5.20260716.1'
  '@santi020k/astro-doctor': '^1.0.4'
  '@santi020k/eslint-plugin-astro-doctor': '^1.0.4'
  '@santi020k/lumen-astro': '^0.3.0'
  '@types/node': '^26.1.1'
  astro: '^7.1.3'
  drizzle-orm: '^0.45.2'
  hono: '^4.12.32'
  typescript: '^6.0.3'
  vite: '^8.1.4'
  vitest: '^4.1.10'
  wrangler: '^4.114.0'
  zod: '^4.4.3'

allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@santi020k/astro-doctor'
  - '@santi020k/eslint-config-basic'
  - '@santi020k/eslint-plugin-astro-doctor'
  - '@santi020k/lumen-astro'
  - astro
  - '@santi020k/lumen-core@0.3.0'
  - '@santi020k/lumen@0.3.0'
  - hono@4.12.32
