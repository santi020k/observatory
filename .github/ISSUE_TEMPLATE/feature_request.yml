name: Feature request
description: Propose a focused improvement to Observatory.
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational decision or workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and data boundary
      description: Note any private sources, credentials, or public API exposure involved.
