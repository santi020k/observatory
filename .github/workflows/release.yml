name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to tag and publish from main
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify, tag, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Releases must be dispatched from the main branch.' >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1.1.1
        with:
          node-version-file: .node-version

      - name: Validate release tag
        run: pnpm release:validate-tag -- "$RELEASE_TAG"

      - name: Verify release
        run: pnpm verify

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already points to $tag_sha, not $GITHUB_SHA." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points to this main commit; continuing."
          else
            git tag --annotate "$RELEASE_TAG" --message "Observatory $RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --verify-tag --generate-notes --title "Observatory $RELEASE_TAG"
