name: Quality

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1.3.0
        with:
          node-version-file: .node-version

      - name: Generate Astro types
        run: pnpm --filter @santi020k/observatory-web exec astro sync

      - name: Verify repository
        run: pnpm verify
