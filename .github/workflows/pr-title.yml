# Managed by the santi020k PR title standard.
name: PR Title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Validate metadata only; never check out or execute PR code.
            const pullRequest = context.payload.pull_request
            const ignored = pullRequest.labels.some(label => label.name === 'autorelease: pending')
            const pattern = /^(feat|fix|docs|style|chore|refactor|perf|test|ci|build|revert)(\([^)\r\n]+\))?!?: (?![A-Z])[^\r\n]+$/
            const valid = ignored || pattern.test(pullRequest.title)
            const description = ignored
              ? 'Release automation title is exempt.'
              : valid
                ? 'Pull request title follows the repository standard.'
                : 'Use a conventional title with a lowercase subject, e.g. feat: add repository-aware prompts'

            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pullRequest.head.sha,
              state: valid ? 'success' : 'failure',
              context: 'PR title',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

            if (!valid) core.setFailed(description)
