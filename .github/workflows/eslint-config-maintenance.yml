name: ESLint config maintenance

on:
  pull_request:
    paths:
      - .github/workflows/eslint-config-maintenance.yml
      - '**/eslint.config.*'
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify ESLint config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1.1.1
        with:
          node-version: 24

      - name: Check compatibility
        run: pnpm exec basic-eslint compatibility
      - name: Check config declaration portability when supported
        run: |
          cli=node_modules/@santi020k/eslint-config-basic/dist/cli.js
          if node "$cli" config-types --help | grep -q 'Usage: basic-eslint config-types'; then
            node "$cli" config-types
          else
            echo 'Skipping config declaration portability until Basic 3.4.0 is installed.'
          fi
      - name: Capture Doctor report
        run: pnpm exec basic-eslint doctor --json > .eslint-config-doctor.json
      - name: Check committed snapshot when present
        run: |
          if [ -f .eslint-config-snapshot.json ]; then
            pnpm exec basic-eslint snapshot --check
          fi
      - name: Upload Doctor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-config-doctor
          path: .eslint-config-doctor.json
          if-no-files-found: warn
