name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://observatory.santi020k.com
    env:
      INFISICAL_PROJECT_ID: b0239823-1d6e-492c-8449-517ab0b8b115
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1.1.1
        with:
          node-version-file: .node-version

      - name: Install Infisical CLI
        run: npm install --global @infisical/cli@0.43.124

      - name: Authenticate to Infisical with GitHub OIDC
        env:
          INFISICAL_IDENTITY_ID: 915c434a-dc2a-48cb-9dd6-6019b9181375
        run: |
          set -eu
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Fsanti020k")"
          oidc_token="$(printf '%s' "$oidc_response" | jq --exit-status --raw-output '.value')"
          infisical_token="$(infisical login \
            --method=oidc-auth \
            --machine-identity-id="$INFISICAL_IDENTITY_ID" \
            --oidc-jwt="$oidc_token" \
            --silent \
            --plain)"
          echo "::add-mask::$infisical_token"
          printf 'INFISICAL_TOKEN=%s\n' "$infisical_token" >> "$GITHUB_ENV"

      - name: Validate deployment credentials
        run: |
          # The nested shell expands Infisical-injected values.
          # shellcheck disable=SC2016
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/api -- \
            sh -c 'test -n "$CLOUDFLARE_DEPLOY_API_TOKEN" \
              || { echo "::error::CLOUDFLARE_DEPLOY_API_TOKEN is missing in Infisical"; exit 1; }'

      - name: Load production secrets and verify
        run: >-
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/api --
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/web --
          pnpm verify

      - name: Apply database migrations
        run: |
          # The nested shell expands Infisical-injected values.
          # shellcheck disable=SC2016
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/api -- \
            sh -c 'CLOUDFLARE_API_TOKEN="$CLOUDFLARE_DEPLOY_API_TOKEN" \
              pnpm --filter @santi020k/observatory-api run db:migrate:remote'

      - name: Deploy API Worker
        run: |
          # Nested processes expand Infisical-injected values.
          # shellcheck disable=SC2016
          infisical run --silent --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/api -- \
            node --input-type=module -e '
              const requiredNames = [
                "AUTH_SECRET",
                "CLOUDFLARE_ACCOUNT_ID",
                "CLOUDFLARE_API_TOKEN",
                "CORS_ORIGIN",
                "FEEDBACK_HASH_SECRET",
                "GITHUB_TOKEN",
                "MAIL_FROM",
                "OWNER_EMAIL",
                "OWNER_PASSCODE",
                "RESEND_API_KEY",
                "SITE_URL",
                "TURNSTILE_SECRET_KEY",
                "TURNSTILE_SITE_KEY"
              ]
              const optionalNames = [
                "APP_STORE_CONNECT_ISSUER_ID",
                "APP_STORE_CONNECT_KEY_ID",
                "APP_STORE_CONNECT_PRIVATE_KEY",
                "APP_STORE_CONNECT_REPORT_REQUESTS_JSON",
                "GOOGLE_PLAY_REPORT_BUCKET",
                "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
              ]
              const missing = requiredNames.filter(name => !process.env[name])

              if (missing.length > 0)
                throw new Error("Missing production secrets: " + missing.join(", "))

              const names = [
                ...requiredNames,
                ...optionalNames.filter(name => process.env[name])
              ]

              process.stdout.write(JSON.stringify(Object.fromEntries(
                names.map(name => [name, process.env[name]])
              )))
            ' | infisical run --silent --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/api -- \
              sh -c 'CLOUDFLARE_API_TOKEN="$CLOUDFLARE_DEPLOY_API_TOKEN" \
                pnpm --filter @santi020k/observatory-api exec wrangler secret bulk'
          # The nested shell expands Infisical-injected values.
          # shellcheck disable=SC2016
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/api -- sh -c '
            set -eu
            version_tag="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_DEPLOY_API_TOKEN" \
              pnpm --filter @santi020k/observatory-api exec wrangler versions upload \
                --tag "$version_tag" --message "GitHub $GITHUB_SHA"
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_DEPLOY_API_TOKEN" \
              pnpm --filter @santi020k/observatory-api exec wrangler versions deploy \
                --version-tag "$version_tag" --yes --message "GitHub $GITHUB_SHA"

            trigger_config="$RUNNER_TEMP/observatory-api-triggers.json"
            pnpm --filter @santi020k/observatory-api exec node --input-type=module -e "
              import { writeFileSync } from \"node:fs\"
              import { experimental_readRawConfig } from \"wrangler\"

              const { rawConfig } = experimental_readRawConfig({ config: \"wrangler.jsonc\" })
              const crons = rawConfig.triggers?.crons

              if (!rawConfig.name || !Array.isArray(crons) || crons.length === 0)
                throw new Error(\"The API Wrangler config must define a name and cron triggers.\")

              writeFileSync(
                process.argv[1],
                JSON.stringify({ name: rawConfig.name, triggers: { crons } })
              )
            " "$trigger_config"
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_DEPLOY_API_TOKEN" \
              pnpm --filter @santi020k/observatory-api exec wrangler triggers deploy \
                --config "$trigger_config"
          '

      - name: Deploy web Worker
        run: |
          # The nested shell expands Infisical-injected values.
          # shellcheck disable=SC2016
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/api -- \
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/apps/web -- \
          sh -c '
            set -eu
            pnpm --filter @santi020k/observatory-web build
            version_tag="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_DEPLOY_API_TOKEN" \
              pnpm --filter @santi020k/observatory-web exec wrangler versions upload \
                --tag "$version_tag" --message "GitHub $GITHUB_SHA"
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_DEPLOY_API_TOKEN" \
              pnpm --filter @santi020k/observatory-web exec wrangler versions deploy \
                --version-tag "$version_tag" --yes --message "GitHub $GITHUB_SHA"
          '
