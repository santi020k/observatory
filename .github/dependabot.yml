version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 2
    groups:
      safe-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:15'
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(deps)
